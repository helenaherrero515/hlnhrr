<!doctype html>
<html lang="en" data-loading="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HLN · Helena Herrero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Nunito:wght@700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#fff; --ink:#111; --muted:#5b6070; --dot:rgba(17,17,17,.12); --card:#fff; --shadow:rgba(0,0,0,.18);
    --yellow:#ffd500; --red:#e3000b; --blue:#006cdc; --green:#00b140;
  }
  :root[data-theme="dark"] {
    --bg:#14151a; --ink:#f4f4f6; --muted:#a3a8b8; --dot:rgba(255,255,255,.1); --card:#1d1f27; --shadow:rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { overscroll-behavior:none; width:100%; height:100%; overflow:hidden; }
  body { font-family:'Nunito',system-ui,sans-serif; background:var(--bg); color:var(--ink); transition:background-color .3s,color .3s; }
  .dots { background-image:radial-gradient(circle,var(--dot) 1.6px,transparent 1.8px); background-size:28px 28px; }
  .mono { font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }
  .pixel { font-family:'Pixelify Sans',ui-monospace,Menlo,Consolas,monospace; font-weight:700; }

  /* ---------- loader ---------- */
  #loader { position:fixed; inset:0; z-index:100; touch-action:none; overscroll-behavior:none; }
  #stage { position:absolute; inset:0; overflow:hidden; background-color:var(--bg); }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:0 24px 28px; pointer-events:none; }
  .percent { display:flex; align-items:baseline; gap:8px; line-height:1; font-size:clamp(48px,9vw,112px); }
  .percent small { font-size:.35em; color:var(--muted); }
  #status { margin-top:12px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .segs { display:flex; gap:8px; padding-bottom:8px; }
  .seg { width:14px; height:14px; border-radius:999px; background:color-mix(in srgb,var(--muted) 30%,transparent); transition:background-color .25s,transform .25s; }
  .seg.on { background:var(--red); transform:translateY(-2px); }
  .segs.full .seg.on { background:var(--green); }
  #wall { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  @media (min-width:768px) { .hud { padding:0 48px 28px; } }

  /* replay overlay after completion in standalone mode */
  #replay-wrap {
    position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; z-index:50; background:var(--bg);
  }
  #replay-wrap.show { display:flex; }
  .btn-replay {
    font:700 14px 'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:.08em;
    padding:12px 24px; border-radius:8px; border:2px solid var(--ink); background:var(--yellow); color:#111;
    cursor:pointer; box-shadow:0 4px 0 var(--shadow); transition:transform .1s,box-shadow .1s;
  }
  .btn-replay:active { transform:translateY(2px); box-shadow:0 2px 0 var(--shadow); }
</style>
</head>
<body>

<!-- ================= LOADER ================= -->
<div id="loader" role="status" aria-live="polite" aria-label="Loading HLN portfolio">
  <div id="stage" class="dots">
    <canvas id="cv" aria-hidden="true"></canvas>

    <div class="hud">
      <div>
        <div class="percent pixel"><span id="num" aria-hidden="true">000</span><small aria-hidden="true">%</small></div>
        <p id="status" class="mono">Step 1 · Snap the pieces together</p>
      </div>
      <div id="segs" class="segs" aria-hidden="true"></div>
    </div>
  </div>

  <canvas id="wall" aria-hidden="true"></canvas>
</div>

<div id="replay-wrap">
  <p class="pixel" style="font-size:32px;">HLN · Ready!</p>
  <button id="replayBtn" class="btn-replay" type="button">Replay Loader</button>
</div>

<script>
(() => {
  const CONFIG = {
    redirectTo: null,
    once: false
  };
  const COLORS = { yellow:'#ffd500', red:'#e3000b', blue:'#006cdc', green:'#00b140' };
  const KEY = 'hln-loader-seen';
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* theme sync */
  try { const t = localStorage.getItem('hln-theme'); if (t) root.dataset.theme = t; } catch (e) {}

  const loading = () => root.dataset.loading === 'true';
  addEventListener('wheel', e => { if (loading()) e.preventDefault(); }, { passive: false });
  addEventListener('touchmove', e => { if (loading()) e.preventDefault(); }, { passive: false });
  addEventListener('keydown', e => {
    if (loading() && [' ', 'ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'End', 'Home'].includes(e.key)) e.preventDefault();
  });

  const loader = document.getElementById('loader');
  const replayWrap = document.getElementById('replay-wrap');
  document.getElementById('replayBtn')?.addEventListener('click', () => location.reload());

  if (CONFIG.once) {
    let seen = false;
    try { seen = !!sessionStorage.getItem(KEY); } catch (e) {}
    if (seen) { root.dataset.loading = 'false'; loader.remove(); replayWrap.classList.add('show'); return; }
  }

  /* HLN letters in bricks */
  const LETTERS = [
    { color: COLORS.yellow, rows: ['X...X','X...X','X...X','XXXXX','X...X','X...X','X...X'] },   // H
    { color: COLORS.red,    rows: ['X....','X....','X....','X....','X....','X....','XXXXX'] },   // L
    { color: COLORS.blue,   rows: ['X...X','XX..X','X.X.X','X.X.X','X..XX','X..XX','X...X'] }    // N
  ];
  const COLS = 17, CX = 8, ROWS = 7;
  const FALL_SPAN = 0.18, LAND_AT = 0.7;

  function mulberry32(a){ return () => { a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  const rand = mulberry32(2026);

  const raw = [];
  LETTERS.forEach((L, li) => L.rows.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === 'X') raw.push({ x: li * 6 + c, y: ROWS - 1 - r, color: L.color, j: rand() });
  })));
  raw.sort((a, b) => a.y - b.y || a.j - b.j);
  const specs = raw.map((b, i) => ({
    x: b.x, y: b.y, color: b.color,
    start: (i / raw.length) * 0.82,
    fromY: 13 + rand() * 5,
    dx: (rand() - .5) * 2.4,
    rz: (rand() - .5) * 1.6,
    landed: false
  }));
  const zOrder = specs.map((_, i) => i).sort((a, b) => specs[a].y - specs[b].y || specs[a].x - specs[b].x);

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (h, t, k) => { const c = hex(h); return `rgb(${c.map(v => Math.round(v + (t - v) * k)).join(',')})`; };
  const SHADES = {};
  Object.values(COLORS).forEach(c => SHADES[c] = { front: c, top: mix(c, 255, .28), side: mix(c, 0, .26), edge: mix(c, 0, .38) });

  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, u = 40, dpr = 1;
  const wcv = document.getElementById('wall'), wctx = wcv.getContext('2d');
  let wall = [], wallPhase = null, wallT = 0, WB = { bw: 80, bh: 50, rows: 10 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wcv.width = cv.width; wcv.height = cv.height; wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (wallPhase) buildWall();
    u = Math.min(W * .9 / 20.8, H * .45 / 9, 66);
  }
  resize();
  addEventListener('resize', resize);

  const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
  addEventListener('pointermove', e => { pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1; });

  const clamp01 = v => Math.min(1, Math.max(0, v));
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function stud(cx, cy, s) {
    const rx = u * .27, ry = u * .115, h = u * .15;
    ctx.fillStyle = s.side;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(cx - rx, cy - h, rx * 2, h);
    ctx.fillStyle = s.top;
    ctx.beginPath(); ctx.ellipse(cx, cy - h, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }

  function brick(color, vx, vy) {
    const s = SHADES[color], h = u / 2;
    ctx.fillStyle = s.top;
    ctx.beginPath(); ctx.moveTo(-h, -h); ctx.lineTo(h, -h); ctx.lineTo(h + vx, -h + vy); ctx.lineTo(-h + vx, -h + vy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = s.side;
    ctx.beginPath(); ctx.moveTo(h, -h); ctx.lineTo(h + vx, -h + vy); ctx.lineTo(h + vx, h + vy); ctx.lineTo(h, h); ctx.closePath(); ctx.fill();
    ctx.fillStyle = s.front; rr(-h, -h, u, u, u * .06); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(-h + 1, -h + 1, u - 2, u * .1);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-h + 1, h - u * .13, u - 2, u * .13 - 1);
    ctx.strokeStyle = s.edge; ctx.globalAlpha = .35; ctx.lineWidth = 1;
    rr(-h + .5, -h + .5, u - 1, u - 1, u * .06); ctx.stroke(); ctx.globalAlpha = 1;
    stud(vx / 2, -h + vy / 2 + u * .02, s);
  }

  const parts = [];
  function burst(x, y, color, n, power, up) {
    for (let i = 0; i < n && parts.length < 160; i++) {
      const a = Math.random() * Math.PI * 2, sp = power * (.4 + Math.random() * .8);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (up ? power * 1.1 : power * .35), life: 0, max: .5 + Math.random() * .6, s: u * (.08 + Math.random() * .1), c: color });
    }
  }
  function stepParts(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.vy += u * 14 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }

  const numEl = document.getElementById('num'), statusEl = document.getElementById('status');
  const segsEl = document.getElementById('segs');
  const SEGMENTS = 10;
  for (let i = 0; i < SEGMENTS; i++) { const s = document.createElement('i'); s.className = 'seg'; segsEl.appendChild(s); }
  const segs = [...segsEl.children];
  const STEPS = [[0,'Step 1 · Snap the pieces together'],[30,'Step 2 · Stack it up'],[60,'Step 3 · Press every stud down'],[90,'Step 4 · Almost there']];
  let lastPct = -1;
  function hud(p) {
    const pct = Math.round(p * 100);
    if (pct === lastPct) return; lastPct = pct;
    numEl.textContent = String(pct).padStart(3, '0');
    const lit = Math.round(p * SEGMENTS);
    segs.forEach((el, i) => el.classList.toggle('on', i < lit));
    if (pct < 100) {
      const msg = [...STEPS].reverse().find(s => pct >= s[0])[1];
      if (statusEl.textContent !== msg) statusEl.textContent = msg;
    }
  }

  const T = { buildStart: .45, buildDur: 3.4, complete: 3.85, waveStart: 3.8, waveDur: 1.1, cover: 5.35 };
  let t = reduce ? T.cover - .8 : 0;
  let completed = false, covering = false, finished = false, last = performance.now();

  function complete() {
    completed = true;
    hud(1); segsEl.classList.add('full');
    statusEl.textContent = 'HLN · Helena Herrero · Ready';
    if (!reduce) {
      const cols = Object.values(COLORS);
      for (let i = 0; i < 56; i++) burst(W / 2 + (Math.random() - .5) * u * 14, H * .42, cols[i % 4], 1, u * 7, true);
    }
  }

  function reveal() {
    stage.style.visibility = 'hidden';
    root.dataset.loading = 'false';
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
    window.dispatchEvent(new Event('loader:done'));
    if (CONFIG.redirectTo) setTimeout(() => { location.href = CONFIG.redirectTo; }, 700);
  }
  function finish() {
    finished = true;
    loader.remove();
    replayWrap.classList.add('show');
  }

  const easeOutBack = x => { const c1 = 1.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeInCubic = x => x * x * x;

  function buildWall() {
    const bw = Math.max(56, Math.min(W / 12, 120)), bh = bw * .62;
    const cols = Math.ceil(W / bw) + 2, rows = Math.ceil(H / bh) + 1;
    const rnd = mulberry32(7), cs = Object.values(COLORS);
    WB = { bw, bh, rows };
    wall = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        wall.push({ r, x: (c - 1) * bw - (r % 2 ? bw / 2 : 0), color: cs[(rnd() * 4) | 0], d: rnd() * .05 });
  }

  function wallBrick(b, y) {
    const { bw, bh } = WB, s = SHADES[b.color], x = b.x;
    [.27, .73].forEach(k => {
      const cx = x + bw * k, rx = bw * .11, ry = bh * .1, h = bh * .1;
      wctx.fillStyle = s.side;
      wctx.beginPath(); wctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI * 2); wctx.fill();
      wctx.fillRect(cx - rx, y - h, rx * 2, h);
      wctx.fillStyle = s.top;
      wctx.beginPath(); wctx.ellipse(cx, y - h, rx, ry, 0, 0, Math.PI * 2); wctx.fill();
    });
    wctx.fillStyle = s.front;
    wctx.beginPath(); if (wctx.roundRect) wctx.roundRect(x, y, bw, bh, bh * .08); else wctx.rect(x, y, bw, bh); wctx.fill();
    wctx.fillStyle = 'rgba(255,255,255,.22)'; wctx.fillRect(x + 1, y + 1, bw - 2, bh * .12);
    wctx.fillStyle = 'rgba(0,0,0,.18)'; wctx.fillRect(x + 1, y + bh - bh * .14, bw - 2, bh * .14 - 1);
    wctx.fillStyle = 'rgba(0,0,0,.12)'; wctx.fillRect(x + bw - bw * .04, y + 1, bw * .04 - 1, bh - 2);
    wctx.strokeStyle = s.edge; wctx.globalAlpha = .35; wctx.lineWidth = 1;
    wctx.strokeRect(x + .5, y + .5, bw - 1, bh - 1); wctx.globalAlpha = 1;
  }

  function drawWall(dt) {
    if (!wallPhase) return;
    wallT += dt;
    const inPhase = wallPhase === 'in';
    const p = clamp01(wallT / (inPhase ? 1.3 : 1.2));
    wctx.clearRect(0, 0, W, H);
    for (const b of wall) {
      const finalY = H - (b.r + 1) * WB.bh;
      let y;
      if (inPhase) {
        const k = clamp01((p - (b.r / WB.rows) * .56 - b.d) / .38);
        if (k <= 0) continue;
        const startY = H + WB.bh;
        y = startY + (finalY - startY) * easeOutBack(k);
      } else {
        const k = clamp01((p - (b.r / WB.rows) * .45 - b.d) / .5);
        if (k >= 1) continue;
        y = finalY - easeInCubic(k) * (finalY + WB.bh * 3);
      }
      wallBrick(b, y);
    }
    if (p >= 1) {
      if (inPhase) { reveal(); wallPhase = 'out'; wallT = 0; }
      else { wallPhase = null; wctx.clearRect(0, 0, W, H); finish(); }
    }
  }

  function startCurtain() {
    covering = true;
    if (reduce) {
      const a = loader.animate ? loader.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }) : null;
      (a ? a.finished : Promise.resolve()).then(() => { reveal(); finish(); });
      return;
    }
    buildWall(); wallPhase = 'in'; wallT = 0;
  }

  addEventListener('keydown', e => { if (e.key === 'Escape' && !covering) t = Math.max(t, T.cover); });

  function frame(now) {
    if (finished) return;
    const dt = Math.min((now - last) / 1000, .05); last = now; t += dt;

    const intro = easeOutCubic(clamp01(t / .7));
    const build = (() => { const x = clamp01((t - T.buildStart) / T.buildDur); return x * x; })();
    const wave = clamp01((t - T.waveStart) / T.waveDur);
    if (!completed) hud(build);
    if (!completed && t >= T.complete) complete();
    if (!covering && t >= T.cover) startCurtain();

    pointer.sx += (pointer.x - pointer.sx) * (1 - Math.exp(-dt * 4));
    pointer.sy += (pointer.y - pointer.sy) * (1 - Math.exp(-dt * 4));
    const vx = u * (.30 + pointer.sx * .10), vy = -u * (.24 - pointer.sy * .06);
    const Xc = W / 2 - 1.5 * vx, Yp = H * .5 + 3.4 * u;
    const ph = u * .5, PW = 19 * u;

    ctx.clearRect(0, 0, W, H);

    const po = 9 * u * (1 - intro);
    if (intro > .001) {
      const g = SHADES[COLORS.green], px = Xc - PW / 2, py = Yp + po;
      ctx.fillStyle = g.top;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + PW, py); ctx.lineTo(px + PW + 3 * vx, py + 3 * vy); ctx.lineTo(px + 3 * vx, py + 3 * vy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = g.side;
      ctx.beginPath(); ctx.moveTo(px + PW, py); ctx.lineTo(px + PW + 3 * vx, py + 3 * vy); ctx.lineTo(px + PW + 3 * vx, py + 3 * vy + ph); ctx.lineTo(px + PW, py + ph); ctx.closePath(); ctx.fill();
      ctx.fillStyle = g.front; rr(px, py, PW, ph, u * .08); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(px + 1, py + 1, PW - 2, u * .08);
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(px + 1, py + ph - u * .1, PW - 2, u * .1 - 1);
      for (let x = -9; x <= 9; x++) stud(Xc + x * u + vx * 2.5, py + vy * 2.5, g);
    }

    const poses = new Array(specs.length);
    for (let i = 0; i < specs.length; i++) {
      const sp = specs[i];
      const k0 = clamp01((build - sp.start) / FALL_SPAN);
      if (k0 <= 0) continue;
      const fall = Math.min(k0 / LAND_AT, 1);
      let yOff = 0, sy = 1;
      if (k0 < LAND_AT) yOff = sp.fromY * (1 - fall * fall);
      else {
        const k = (k0 - LAND_AT) / (1 - LAND_AT);
        yOff = .28 * Math.sin(k * Math.PI) * (1 - k);
        sy = 1 - .14 * Math.sin(Math.min(k * 2.5, 1) * Math.PI);
      }
      const w = clamp01(wave * 1.8 - (sp.x / (COLS - 1)) * .8);
      const hop = w > 0 && w < 1 ? Math.sin(w * Math.PI) * .5 : 0;
      const fx = Xc + (sp.x - CX) * u + vx + sp.dx * (1 - fall) * u;
      const fy = Yp + vy - (sp.y + .5) * u - (yOff + hop) * u + (1 - sy) * u * .5;
      poses[i] = { fx, fy, rot: sp.rz * (1 - fall), sx: 1 + (1 - sy) * .5, sy, landed: fall >= 1 };
      if (fall >= 1 && !sp.landed) { sp.landed = true; if (dt < .04) burst(fx, fy + u / 2, sp.color, 5, u * 2.4, false); }
    }
    const draw = i => {
      const p = poses[i]; if (!p) return;
      ctx.save(); ctx.translate(p.fx, p.fy); ctx.rotate(p.rot); ctx.scale(p.sx, p.sy);
      brick(specs[i].color, vx, vy);
      ctx.restore();
    };
    zOrder.forEach(i => { if (poses[i] && poses[i].landed) draw(i); });

    if (intro > .001) { const g = SHADES[COLORS.green]; for (let x = -9; x <= 9; x++) stud(Xc + x * u + vx * .5, Yp + po + vy * .5, g); }

    zOrder.forEach(i => { if (poses[i] && !poses[i].landed) draw(i); });
    stepParts(dt);
    drawWall(dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
